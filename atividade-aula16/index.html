<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Formulário API v2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Formulário de Teste API - v2</h1>
    
    <!-- Aponta para a v2 e envia via POST -->
    <form id="greetForm" action="http://localhost:8000/v2/hi" method="post">
        <div class="form-group">
            <label for="name">Seu Nome:</label>
            <input type="text" id="name" name="name" required placeholder="Digite seu nome">
        </div>

        <!-- Campo adicionado para atender à Atividade 2 (seleção de idioma) -->
        <div class="form-group">
            <label for="lang">Idioma:</label>
            <select id="lang" name="lang">
                <option value="pt-br">Português (Brasil)</option>
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
        
        <button type="submit">Enviar Saudação (v2)</button>
    </form>
</body>
</html>
